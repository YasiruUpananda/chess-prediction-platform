global:
  scrape_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: chess-api
    metrics_path: /metrics
    authorization:
      credentials_file: /run/secrets/metrics-token
    static_configs:
      - targets: ['ml-engine:8000']
  - job_name: chess-workers
    authorization:
      credentials_file: /run/secrets/metrics-token
    static_configs:
      - targets: ['ml-worker:9101','ocr-worker:9101']
