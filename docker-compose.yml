services:
  prometheus:
    image: prom/prometheus:v3.15.0
    profiles: [monitoring]
    restart: unless-stopped
    mem_limit: 512m
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d", "--storage.tsdb.retention.size=1GB"]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./.runtime/metrics-token:/run/secrets/metrics-token:ro
      - prometheusdata:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 5

  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.21.0
    profiles: [observability]
    restart: unless-stopped
    mem_limit: 512m
    ports:
      - "127.0.0.1:16686:16686"

  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chess}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-chessrag}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chess} -d ${POSTGRES_DB:-chessrag}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    hostname: rabbitmq
    restart: unless-stopped
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: neuro_chess
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_UI_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  ml-engine: &api-service
    build:
      context: ./services/ml-engine
      target: api
    restart: unless-stopped
    mem_limit: ${API_MEMORY_LIMIT:-2g}
    cpus: ${API_CPUS:-2}
    ports:
      - "${ML_ENGINE_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-chess}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-chessrag}
      WORKER_DATABASE_URL: postgresql://${POSTGRES_USER:-chess}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-chessrag}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      RABBITMQ_URL: amqp://neuro_chess:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GOOGLE_MODEL: ${GOOGLE_MODEL:-gemini-3.8-flash}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      ENABLE_BROWSER_METRICS: ${ENABLE_BROWSER_METRICS:-false}
      GEMINI_INPUT_USD_PER_MILLION: ${GEMINI_INPUT_USD_PER_MILLION:-}
      GEMINI_OUTPUT_USD_PER_MILLION: ${GEMINI_OUTPUT_USD_PER_MILLION:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_TRACES_SAMPLE_RATIO: ${OTEL_TRACES_SAMPLE_RATIO:-0.25}
      VECTOR_SEARCH_MODE: ${VECTOR_SEARCH_MODE:-exact}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      PGN_DATA_DIR: /app/data
      MAX_PDF_BYTES: ${MAX_PDF_BYTES:-26214400}
      OCR_MAX_PIXELS: ${OCR_MAX_PIXELS:-16000000}
      OCR_QUEUE_LIMIT: ${OCR_QUEUE_LIMIT:-8}
      ASGARDEO_ISSUER: ${ASGARDEO_ISSUER:?Set ASGARDEO_ISSUER in .env}
      ASGARDEO_JWKS_URL: ${ASGARDEO_JWKS_URL:?Set ASGARDEO_JWKS_URL in .env}
      ASGARDEO_AUDIENCE: ${ASGARDEO_AUDIENCE:?Set ASGARDEO_AUDIENCE in .env}
      DB_POOL_MAX: ${DB_POOL_MAX:-8}
      VECTOR_DB_POOL_MAX: ${VECTOR_DB_POOL_MAX:-4}
      OMP_NUM_THREADS: 1
      INGEST_REQUIRED_SCOPE: ${INGEST_REQUIRED_SCOPE:-chess:ingest}
      INGEST_REQUIRED_ROLE: ${INGEST_REQUIRED_ROLE:-}
      INGEST_ROLE_CLAIM: ${INGEST_ROLE_CLAIM:-roles}
      RATE_REPORTS_PER_MINUTE: ${RATE_REPORTS_PER_MINUTE:-6}
      RATE_OCR_PER_MINUTE: ${RATE_OCR_PER_MINUTE:-12}
      RATE_MOVES_PER_MINUTE: ${RATE_MOVES_PER_MINUTE:-60}
      RATE_INGESTION_PER_MINUTE: ${RATE_INGESTION_PER_MINUTE:-5}
      RATE_STUDIES_PER_MINUTE: ${RATE_STUDIES_PER_MINUTE:-30}
    volumes:
      - ./services/ml-engine/data:/app/data:ro
      - modelcache:/root/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  ml-worker:
    build:
      context: ./services/ml-engine
      target: ingestion
    restart: unless-stopped
    mem_limit: ${INGESTION_MEMORY_LIMIT:-2g}
    cpus: ${INGESTION_CPUS:-1}
    command: python worker.py
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-chess}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-chessrag}
      WORKER_DATABASE_URL: postgresql://${POSTGRES_USER:-chess}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-chessrag}
      RABBITMQ_URL: amqp://neuro_chess:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      PGN_DATA_DIR: /app/data
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_TRACES_SAMPLE_RATIO: ${OTEL_TRACES_SAMPLE_RATIO:-0.25}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      DB_POOL_MAX: 2
      VECTOR_DB_POOL_MAX: 2
      OMP_NUM_THREADS: 1
    volumes:
      - ./services/ml-engine/data:/app/data:ro
      - modelcache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time; assert time.time()-os.path.getmtime('/tmp/ingestion-heartbeat') < 45"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  ocr-worker:
    build:
      context: ./services/ml-engine
      target: ocr
    command: python ocr_worker.py
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1
    environment:
      WORKER_DATABASE_URL: postgresql://${POSTGRES_USER:-chess}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-chessrag}
      OCR_TIMEOUT_SECONDS: ${OCR_TIMEOUT_SECONDS:-45}
      OCR_MAX_PIXELS: ${OCR_MAX_PIXELS:-16000000}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_TRACES_SAMPLE_RATIO: ${OTEL_TRACES_SAMPLE_RATIO:-0.25}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      DB_POOL_MAX: 2
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time; assert time.time()-os.path.getmtime('/tmp/ocr-heartbeat') < 45"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s

  backend-tests:
    <<: *api-service
    profiles: [test]
    build:
      context: ./services/ml-engine
      target: test
    restart: "no"
    ports: []
    healthcheck:
      disable: true
    command: ["python", "-m", "unittest", "test_reliability", "test_prediction_quality", "test_strategy_reports", "test_pdf_reader", "test_reliability_integration", "test_backend_efficiency", "test_backend_integration", "test_telemetry", "test_vector_search", "test_product", "test_measurements", "-v"]

  db-backup:
    image: postgres:16-alpine
    profiles: [backup]
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-chess}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-chessrag}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    entrypoint: ["sh", "/scripts/backup.sh"]
    volumes:
      - ./scripts/backup.sh:/scripts/backup.sh:ro
      - ./scripts/verify-backup.sh:/scripts/verify-backup.sh:ro
      - backups:/backups
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /backups/last-success && test $$(($$(date +%s)-$$(cat /backups/last-success))) -lt $$(($$BACKUP_INTERVAL_SECONDS+120))"]
      interval: 60s
      timeout: 5s
      retries: 3

volumes:
  prometheusdata:
  pgdata:
  rabbitmqdata:
  modelcache:
  backups:
