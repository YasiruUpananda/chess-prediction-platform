name: Repository checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint && npm test && npm run api:check && npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: frontend-browser-failures
          path: frontend/test-results
  backend-and-authenticated-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      POSTGRES_PASSWORD: ci-isolated-database
      REDIS_PASSWORD: ci-isolated-cache
      RABBITMQ_PASSWORD: ci-isolated-queue
      ASGARDEO_ISSUER: https://example.invalid/test
      ASGARDEO_JWKS_URL: https://example.invalid/jwks
      ASGARDEO_AUDIENCE: ci-tests
      GOOGLE_API_KEY: ''
      BROWSER_TEST_API: http://127.0.0.1:8011
      RUN_INTEGRATION_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: docker compose build migrate backend-tests browser-api ocr-worker
      - run: docker compose up -d db redis rabbitmq && docker compose run --rm migrate && docker compose up -d --wait ocr-worker
      - run: docker compose run --rm -e RUN_INTEGRATION_TESTS=1 backend-tests
      - name: Check live API schema against the committed contract
        run: >-
          docker compose run --rm --no-deps -v "$PWD/frontend/openapi/schema.json:/contract.json:ro"
          backend-tests python -c "import json,main; assert json.load(open('/contract.json')) == main.app.openapi(), 'Regenerate the OpenAPI contract'"
      - name: Seed only an isolated browser player fixture
        run: >-
          docker compose run --rm backend-tests python -c
          "from database import connect; db=connect(); conn=db.__enter__(); conn.execute(\"INSERT INTO ingested_games(id,white,black,indexed) VALUES ('ci-browser-fixture','CI Player','CI Opponent',true) ON CONFLICT DO NOTHING\"); db.__exit__(None,None,None)"
      - run: docker compose up -d --wait browser-api
      - run: npm ci && npm run build && npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test e2e/product.spec.js --grep 'signed JWT'
        working-directory: frontend
      - name: Preserve diagnostic logs
        if: failure()
        run: docker compose logs --no-color > compose-test.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-browser-failures
          path: |
            compose-test.log
            frontend/test-results
      - run: docker compose down --volumes
        if: always()
