server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    gzip_static on;
    gzip_vary on;
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        location ~ \.mjs$ {
            types { application/javascript mjs; }
        }
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
