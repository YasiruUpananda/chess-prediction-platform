[project]
name = "neuro-chess-backend"
version = "2.1.0"
requires-python = ">=3.11,<3.12"
dependencies = ["chess==1.10.0", "python-dotenv==1.0.1", "psycopg[binary,pool]>=3.3,<4", "opentelemetry-sdk>=1.30,<2", "opentelemetry-exporter-otlp-proto-http>=1.30,<2", "prometheus-client>=0.22,<1"]

[project.optional-dependencies]
api = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "redis>=5,<7",
  "pydantic>=2.10,<3", "httpx>=0.27,<1", "PyJWT[crypto]>=2.10,<3",
  "python-multipart>=0.0.20,<1", "pillow>=11,<13", "pika>=1.3,<2",
  "opentelemetry-instrumentation-fastapi>=0.51b0,<1",
]
embeddings = [
  "langchain-postgres==0.0.17", "langchain-huggingface==0.2.0",
  "torch>=2.5,<3", "numpy>=1.26,<3",
]
ingestion = ["pika>=1.3,<2"]
ocr = ["PyMuPDF>=1.26,<2", "pytesseract>=0.3.13,<1", "pillow>=11,<13"]

[dependency-groups]
test = ["PyMuPDF>=1.26,<2", "pytesseract>=0.3.13,<1"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
